<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>__LABEL__ · __BOT_NAME__ Console</title>
<link rel="stylesheet" href="/static/xterm.css">
<style>
  :root { color-scheme: dark; --bg:#0b0e14; --panel:#11151d; --line:#1f2633; --fg:#c9d1d9; --accent:#7c6aff; --ok:#3fb950; --bad:#f85149; --warn:#d29922; }
  * { box-sizing:border-box; }
  html,body { height:100%; margin:0; background:var(--bg); color:var(--fg); font:14px/1.4 system-ui,-apple-system,Segoe UI,sans-serif; }
  body { display:flex; flex-direction:column; padding-top:env(safe-area-inset-top); padding-bottom:env(safe-area-inset-bottom); }
  header { display:flex; align-items:center; gap:12px; padding:10px 14px; background:var(--panel); border-bottom:1px solid var(--line); }
  .brand { font-weight:700; color:var(--accent); }
  .label { font-family:ui-monospace,Menlo,Consolas,monospace; opacity:.9; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .grow { flex:1; }
  .status { display:flex; align-items:center; gap:6px; font-size:12px; opacity:.9; }
  .dot { width:9px; height:9px; border-radius:50%; background:var(--warn); }
  .dot.ok { background:var(--ok); } .dot.bad { background:var(--bad); }
  button { background:#1b2230; color:var(--fg); border:1px solid var(--line); border-radius:6px; padding:5px 10px; cursor:pointer; font:inherit; }
  button:hover { border-color:var(--accent); }
  #wrap { flex:1; min-height:0; padding:8px; }
  #term { height:100%; }
  .xterm .xterm-viewport { background:transparent !important; }
  #banner { display:none; padding:8px 14px; background:#2a1316; color:#ffb4ae; border-bottom:1px solid #4a1d22; font-size:13px; }
</style>
</head>
<body>
<header>
  <span class="brand">⚡ __BOT_NAME__</span>
  <span class="label">__LABEL__</span>
  <span class="grow"></span>
  <span class="status"><span class="dot" id="dot"></span><span id="state">connecting…</span></span>
  <button id="fs" title="Fullscreen">⛶</button>
</header>
<div id="banner"></div>
<div id="wrap"><div id="term"></div></div>
<script src="/static/xterm.js"></script>
<script src="/static/xterm-addon-fit.js"></script>
<script src="/static/xterm-addon-web-links.js"></script>
<script>
(function () {
  var TOKEN = "__TOKEN__";
  var dot = document.getElementById('dot'), state = document.getElementById('state'), banner = document.getElementById('banner');
  function setState(t, cls) { state.textContent = t; dot.className = 'dot ' + (cls || ''); }
  function fail(msg) { banner.style.display = 'block'; banner.textContent = msg; setState('disconnected', 'bad'); }

  var term = new Terminal({ cursorBlink:true, fontFamily:'ui-monospace,Menlo,Consolas,monospace', fontSize:14, scrollback:5000,
    theme:{ background:'#0b0e14', foreground:'#c9d1d9', cursor:'#7c6aff', selectionBackground:'#33406a' } });
  var fit = new FitAddon.FitAddon();
  term.loadAddon(fit);
  term.loadAddon(new WebLinksAddon.WebLinksAddon());
  term.open(document.getElementById('term'));
  fit.fit();
  term.focus();

  var proto = location.protocol === 'https:' ? 'wss://' : 'ws://';
  var ws = new WebSocket(proto + location.host + '/ws/' + TOKEN);
  ws.binaryType = 'arraybuffer';
  var closedClean = false;

  function sendResize() { if (ws.readyState === 1) ws.send(JSON.stringify({ t:'r', c:term.cols, r:term.rows })); }
  ws.onopen = function () { setState('connected', 'ok'); fit.fit(); sendResize(); };
  ws.onmessage = function (ev) {
    if (typeof ev.data === 'string') {
      try { var m = JSON.parse(ev.data); } catch (e) { return; }
      if (m.t === 'err') { fail(m.d); } else if (m.t === 'end') { closedClean = true; }
    } else { term.write(new Uint8Array(ev.data)); }
  };
  ws.onclose = function () {
    if (!banner.textContent) fail(closedClean ? 'Session ended. Run /console in Discord for a new link.' : 'Connection closed. Links are single-use — run /console in Discord for a new one.');
    else setState('disconnected', 'bad');
  };
  ws.onerror = function () { fail('Could not connect. The link may be expired or already used.'); };
  term.onData(function (d) { if (ws.readyState === 1) ws.send(JSON.stringify({ t:'i', d:d })); });
  window.addEventListener('resize', function () { fit.fit(); sendResize(); });
  new ResizeObserver(function () { fit.fit(); sendResize(); }).observe(document.getElementById('wrap'));
  document.getElementById('fs').onclick = function () {
    if (!document.fullscreenElement) document.documentElement.requestFullscreen && document.documentElement.requestFullscreen();
    else document.exitFullscreen();
  };
})();
</script>
</body>
</html>
